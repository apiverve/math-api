[project]
name = "apiverve-mathcalculator"
version = "1.2.2"
authors = [
  { name="APIVerve", email="hello@apiverve.com" },
]
description = "Math Calculator performs mathematical operations including arithmetic, number properties, base conversions, and expression evaluation."
keywords = ["math api", "calculator api", "math calculator api", "expression evaluator api", "calculator"]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "requests>=2.25.0"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: English",
]

[project.urls]
Homepage = "https://apiverve.com/marketplace/math?utm_source=pypi&utm_medium=referral&utm_content=homepage"
Documentation = "https://docs.apiverve.com/ref/math?utm_source=pypi&utm_medium=referral&utm_content=docs"
Repository = "https://github.com/apiverve/math-api"
Twitter = "https://twitter.com/apivervehq"
